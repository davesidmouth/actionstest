
name: Weather CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: weather-api
  DOTNET_VERSION: "8.0.x"
  SOLUTION_PATH: testing/testing.sln
  PROJECT_PATH: testing/WebApplication1/WebApplication1.csproj
  DOCKERFILE_PATH: testing/WebApplication1/Dockerfile
  NAMESPACE: weather

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "$SOLUTION_PATH"

      - name: Build
        run: dotnet build "$SOLUTION_PATH" --configuration Release --no-restore

      - name: Login to ACR
        run: az acr login --name "${{ secrets.AZURE_ACR_NAME }}"

      - name: Check secret exists
        run: |
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "$AZURE_CREDENTIALS"
            echo "$AZURE_Name"
          else
            echo "AZURE_CREDENTIALS is empty"
          fi
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_Name: ${{ secrets.AZURE_AKS_NAME }}

      - name: Build and push image
        env:
          ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f "$DOCKERFILE_PATH" \
            -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" \
            testing
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"


      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_AKS_NAME }}" \
            --overwrite-existing

      - name: Deploy using Helm
        env:
          ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install weather-api ./helm/weather-api \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="$ACR_NAME.azurecr.io/$IMAGE_NAME" \
            --set image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/weather-api \
            --namespace "$NAMESPACE"
          kubectl get pods,services -n "$NAMESPACE"
