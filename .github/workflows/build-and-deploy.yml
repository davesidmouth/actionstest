name: Weather CI

on:
  workflow-dispatch:
  push:
    branches:
     - main

env:
  AZURE_WEBAPP_NAME: weather-service
  AZURE_WEBAPP_PACKAGE_PATH: "./Testing/publish"
  DOTNET_VERSION: "8.x"
  SOLUTION_PATH: "./testing/testing.sln"
  API_PROJECT_PATH: "testing.Api"
  PUBLISH_DIR: "./publish"

jobs: 
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: SetUp .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet=version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --no-restore --no-build --property:PublishDir=${{ env.PUBLISH_DIR }}
      
      - name: Publish Artifacts
        uses: Actions/upload-artifacts@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    name: Deploy to azure
    runs-on: ubuntu-latest
    needs: [build-and-test:]

    steps:

      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      
      - name: Deploy
        uses: azure/webapps=deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
     