
name: Weather CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write


 env:
  IMAGE_NAME: weather-api
  CONTAIINER_APP_NAME: ca_name
  RESOURCE_GROUP: rg_name
  DOTNET_VERSION: "8.x"
  SOLUTION_PATH: "./testing/testing.sln"
  PROJECT_PATH: testing\WebApplication1\WebApplication1.csproj
  NAMESPACE: weather

jobs:
  build-and-deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}


      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Login to ACR
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"
        
      - name: Build and push image
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg PROJECT_PATH="$PROJECT_PATH" \
            -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" .
          docker push \
            "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_AKS_NAME }}" \
            --overwrite-existing

      - name: Deploy using Helm
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install weather-api ./helm/weather-api \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="$ACR_NAME.azurecr.io/$IMAGE_NAME" \
            --set image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/weather-api \
            --namespace "$NAMESPACE"
          kubectl get pods,services -n "$NAMESPACE"
